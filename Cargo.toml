[package]
name = "recode-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Practice-first Rust and Axum curriculum"
license = "MIT"
repository = "https://github.com/mmtmn/recode-rust"
keywords = ["rust", "axum", "tower", "tokio", "learning"]
categories = ["web-programming", "development-tools"]

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
hyper = { version = "1.11.0", features = ["client", "http1", "http2", "server"] }
serde = { version = "1.0.228", features = ["derive"] }
syn = { version = "2.0.106", features = ["full"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "router"] }
tower = { version = "0.5.3", features = ["buffer", "limit", "load-shed", "retry", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["compression-gzip", "fs", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1.3"
serde_json = "1.0.145"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
